<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admission Analyser</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      width: 100%;
      max-width: 600px;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 10px;
    }

    p {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .upload-box {
      border: 2px dashed #667eea;
      border-radius: 15px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: 0.3s;
      background: #f8f9ff;
    }

    .upload-box:hover {
      background: #eef1ff;
    }

    .upload-box.dragover {
      background: #dde4ff;
      border-color: #4c5fd7;
    }

    input[type="file"] {
      display: none;
    }

    .file-name {
      margin-top: 15px;
      color: #333;
      font-weight: bold;
      text-align: center;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 25px;
      border: none;
      border-radius: 12px;
      background: #667eea;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #5567d8;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .result {
      margin-top: 25px;
      padding: 20px;
      border-radius: 12px;
      background: #f4f4f4;
      display: none;
    }

    .result h2 {
      margin-bottom: 10px;
      color: #333;
    }

    .result pre {
      white-space: pre-wrap;
      word-wrap: break-word;
      color: #222;
      font-size: 14px;
    }

    .loader {
      text-align: center;
      margin-top: 20px;
      display: none;
      color: #555;
      font-weight: bold;
    }

    .footer {
      margin-top: 20px;
      text-align: center;
      color: #888;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Admission Analyser</h1>
    <p>Upload your file and analyse admission data instantly</p>

    <label class="upload-box" id="uploadBox">
      <input type="file" id="fileInput" />
      <div>
        <h3>📁 Upload File</h3>
        <p>Click or Drag & Drop your file here</p>
      </div>
    </label>

    <div class="file-name" id="fileName">No file selected</div>

    <button id="analyzeBtn">Analyze Admission Data</button>

    <div class="loader" id="loader">Analyzing... Please wait</div>

    <div class="result" id="resultBox">
      <h2>Analysis Result</h2>
      <pre id="resultText"></pre>
    </div>

    <div class="footer">
      Powered by Admission Analyser API
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const uploadBox = document.getElementById('uploadBox');
    const fileName = document.getElementById('fileName');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const resultBox = document.getElementById('resultBox');
    const resultText = document.getElementById('resultText');
    const loader = document.getElementById('loader');

    let selectedFile = null;

    fileInput.addEventListener('change', () => {
      if (fileInput.files.length > 0) {
        selectedFile = fileInput.files[0];
        fileName.textContent = `Selected File: ${selectedFile.name}`;
      }
    });

    uploadBox.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadBox.classList.add('dragover');
    });

    uploadBox.addEventListener('dragleave', () => {
      uploadBox.classList.remove('dragover');
    });

    uploadBox.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadBox.classList.remove('dragover');

      if (e.dataTransfer.files.length > 0) {
        selectedFile = e.dataTransfer.files[0];
        fileInput.files = e.dataTransfer.files;
        fileName.textContent = `Selected File: ${selectedFile.name}`;
      }
    });

    analyzeBtn.addEventListener('click', async () => {
      if (!selectedFile) {
        alert('Please upload a file first.');
        return;
      }

      resultBox.style.display = 'none';
      loader.style.display = 'block';
      analyzeBtn.disabled = true;

      const formData = new FormData();
      formData.append('file', selectedFile);

      try {
        const response = await fetch('srv-d7u2t6beo5us73c2go00/predict', {
          method: 'POST',
          body: formData
        });

        if (!response.ok) {
          throw new Error(`Server Error: ${response.status}`);
        }

        const data = await response.json();

        resultBox.style.display = 'block';
        resultText.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        resultBox.style.display = 'block';
        resultText.textContent = 'Error: ' + error.message + '\n\nPossible Fixes:\n1. Check if API_URL is correct\n2. Ensure backend allows CORS\n3. Ensure API endpoint is active\n4. Verify backend accepts file uploads';
      } finally {
        loader.style.display = 'none';
        analyzeBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
